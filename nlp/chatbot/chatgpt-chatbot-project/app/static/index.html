<!-- app/static/index.html -->
<!-- ------------------------------------------------------------ -->
<!-- FastAPI가 제공하는 챗봇 화면입니다. -->
<!-- 제공된 React 예제의 floating chatbot UI를 순수 HTML/CSS/JS 구조로 다시 구현했습니다. -->
<!-- ------------------------------------------------------------ -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 브라우저가 한글을 정상 표시하도록 UTF-8 문자셋을 지정합니다. -->
    <meta charset="UTF-8" />

    <!-- 모바일 화면에서도 레이아웃이 화면 너비에 맞게 표시되도록 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭에 표시될 제목입니다. -->
    <title>FastAPI ChatGPT ChatBot</title>

    <!-- 별도로 작성한 CSS 파일을 연결합니다. -->
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <!-- 전체 페이지의 메인 영역입니다. -->
    <main class="page">
        <!-- 프로젝트 제목과 설명을 표시하는 영역입니다. -->
        <section class="hero">
            <h1>FastAPI ChatGPT 챗봇 앱</h1>
            <p>오른쪽 아래 챗봇 버튼을 눌러 질문을 입력하세요.</p>
            <p class="notice">API 키가 없으면 데모 모드로 동작하고, API 키를 설정하면 실제 ChatGPT 응답을 받습니다.</p>
        </section>
    </main>

    <!-- 오른쪽 아래에 고정되는 챗봇 열기 버튼입니다. -->
    <button id="chatIcon" class="chat-icon" type="button" aria-label="챗봇 열기">
        💬
    </button>

    <!-- 챗봇 모달 창 전체를 감싸는 영역입니다. hidden 클래스가 있으면 보이지 않습니다. -->
    <section id="chatModal" class="chat-modal hidden" aria-label="챗봇 대화창">
        <!-- 챗봇 모달의 상단 제목 영역입니다. -->
        <header class="chat-header">
            <strong>ChatGPT ChatBot</strong>
            <div class="header-buttons">
                <button id="settingsBtn" class="icon-button" type="button" aria-label="설정 열기">⚙</button>
                <button id="closeChat" class="close-button" type="button" aria-label="챗봇 닫기">×</button>
            </div>
        </header>

        <!-- 대화 메시지가 계속 추가되는 영역입니다. -->
        <div id="chatMessages" class="chat-messages"></div>

        <!-- 사용자 입력 폼입니다. Enter 또는 전송 버튼으로 메시지를 보냅니다. -->
        <form id="chatForm" class="chat-form">
            <input id="messageInput" class="chat-input" type="text" placeholder="질문을 입력하세요." autocomplete="off" />
            <button class="send-button" type="submit">전송</button>
        </form>

        <!-- 설정 패널입니다. hidden 클래스가 있으면 보이지 않습니다. 채팅 화면 위에 덮이는 형태로 표시됩니다. -->
        <div id="settingsPanel" class="settings-panel hidden" aria-label="챗봇 설정">
            <!-- 설정 패널 상단 헤더입니다. -->
            <header class="chat-header">
                <strong>설정</strong>
                <button id="closeSettings" class="close-button" type="button" aria-label="설정 닫기">×</button>
            </header>

            <!-- 설정 항목들이 들어가는 영역입니다. -->
            <div class="settings-body">
                <!-- 시스템 지시문 설정입니다. -->
                <label class="settings-label" for="settingSystemInstruction">
                    시스템 지시문
                    <span class="settings-hint">모델의 역할과 응답 방식을 지정합니다.</span>
                </label>
                <textarea id="settingSystemInstruction" class="settings-textarea settings-textarea-large" rows="3">친절하고 정확한 AI 강사처럼 답변하시오.</textarea>

                <!-- 모델명 설정입니다. -->
                <label class="settings-label" for="settingModel">
                    모델
                    <span class="settings-hint">비워두면 기본 모델이 적용됩니다.</span>
                </label>
                <input id="settingModel" class="settings-input" type="text" placeholder="예: gpt-4o-mini (비워두면 기본 모델 사용)" />

                <!-- Temperature 설정입니다. -->
                <label class="settings-label" for="settingTemperature">
                    Temperature <span id="settingTemperatureValue" class="settings-value">0.7</span>
                    <span class="settings-hint">낮으면 안정적, 높으면 창의적인 출력이 됩니다.</span>
                </label>
                <input id="settingTemperature" class="settings-range" type="range" min="0" max="2" step="0.01" value="0.7" />

                <!-- Top-p 설정입니다. -->
                <label class="settings-label" for="settingTopP">
                    Top-p <span id="settingTopPValue" class="settings-value">0.95</span>
                    <span class="settings-hint">확률 누적 범위를 제한하는 샘플링 설정입니다.</span>
                </label>
                <input id="settingTopP" class="settings-range" type="range" min="0" max="1" step="0.01" value="0.95" />

                <!-- 최대 출력 토큰 수 설정입니다. -->
                <label class="settings-label" for="settingMaxTokens">
                    최대 출력 토큰 수
                    <span class="settings-hint">모델이 한 번에 생성할 수 있는 최대 토큰 수입니다.</span>
                </label>
                <input id="settingMaxTokens" class="settings-input" type="number" min="1" max="8192" value="800" />
            </div>

            <!-- 설정 하단 버튼 영역입니다. -->
            <div class="settings-footer">
                <button id="resetSettings" class="reset-button" type="button">기본값으로 초기화</button>
                <button id="saveSettings" class="save-button" type="button">저장</button>
            </div>
        </div>
    </section>

    <!-- 챗봇 동작을 담당하는 JavaScript 파일을 연결합니다. -->
    <script src="/static/app.js"></script>
</body>
</html>
