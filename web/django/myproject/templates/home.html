{% extends "base.html" %}

{% block title %}메인{% endblock %}

{% block content %}
    <h1>Django 회원 관리 + 게시판 서비스</h1>
    <p>MySQL 연결, Django ORM, 세션 인증, MVT 구조 실습 프로젝트</p>

    <h2>최근 게시글</h2>
    {% for post in recent_posts %}
        <div>
            <a href="{% url 'boards:detail' post.pk %}">{{ post.title }}</a> -
            {{ post.author.display_name }}
        </div>
        {% empty %}
        <p>게시글이 없습니다.</p>
    {% endfor %}
{% endblock %}
