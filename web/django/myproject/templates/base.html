{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        Django Member Board
        {% endblock %}
    </title>
    <!-- 공통 CSS 파일 -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">HOME</a>
            <a href="{% url 'boards:list' %}">게시판</a>
            {% if user.is_authenticated %}
                <span>{{ user.display_name }} 님</span>
                <a href="{% url 'members:logout' %}">로그아웃</a>
            {% else %}
                <a  href="{%  url 'members:login' %}">로그인</a> &nbsp;
                <a  href="{%  url 'members:signup' %}">회원가입</a> &nbsp;
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <hr>

    <footer>
        copyright@4nchez 2026-08
    </footer>
</body>
</html>
